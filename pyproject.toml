[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jlpt-srs-cli"
version = "0.1.0"
description = "Terminal-based JLPT vocabulary spaced repetition tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pytest-sugar",
    "pytest-html",
]

[project.scripts]
jlpt = "jlpt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--html=report.html --self-contained-html --css=assets/report.css"
log_level = "INFO"
log_format = "%(levelname)-5s %(name)s: %(message)s"

[tool.ruff]
line-length = 88
target-version = "py312"
